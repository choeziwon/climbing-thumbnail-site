<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>완등 한 컷 · 실제 UI 디자인 시스템</title><link rel="stylesheet" href="preview/static/shared/fonts.css"><link rel="stylesheet" href="preview/static/shared/scrollbars.css"><link rel="stylesheet" href="preview/work/mobile/v1-design-tokens.css"><link rel="stylesheet" href="preview/work/mobile/frame-color-tokens.css"><link rel="stylesheet" href="preview/work/mobile/frame-ui-tokens.css"><link rel="stylesheet" href="color-system.css?v=20261108-full"><script src="color-system.js?v=20261108-full" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:var(--frame-soft-background);color:var(--frame-text);font-family:Pretendard,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px 80px}h1{font:32px Wave;margin:0 0 14px}p{font-size:14px;line-height:1.7;color:#737780}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}section{min-width:0;padding:24px;background:white;border:1px solid #e7e8eb;border-radius:16px}h2{font-size:18px;margin:0 0 8px}.source{font:12px/1.6 Pretendard;color:#737780;margin:0 0 18px}iframe.sample{border:0;display:block;width:100%;min-height:60px;background:white}.tokens{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.token{font-size:12px;line-height:1.6}.token i{display:block;height:48px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px}#service-source{position:absolute;left:-10000px;top:0;width:402px;height:874px;border:0;visibility:hidden}#status{margin-bottom:24px}a{color:inherit}@media(max-width:720px){main{padding:28px 16px}.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>완등 한 컷</h1><div class="ds-tabs" role="tablist" aria-label="디자인 시스템 분류"><button id="tab-components" type="button" role="tab" data-ds-tab="components" aria-selected="true" aria-controls="panel-components">구성 요소</button><button id="tab-colors" type="button" role="tab" data-ds-tab="colors" aria-selected="false" aria-controls="panel-colors" tabindex="-1">컬러 시스템</button></div><div id="panel-components" role="tabpanel" aria-labelledby="tab-components"><div class="grid" id="catalog"></div></div><div id="panel-colors" role="tabpanel" aria-labelledby="tab-colors" hidden><div class="color-intro"><h2>컬러 시스템</h2></div><div class="color-sections" id="color-catalog"></div></div></main><iframe id="service-source" title="서비스 UI 원본" tabindex="-1" aria-hidden="true"></iframe>
<script src="service-sources.js"></script>
<script>
function serviceDocument(kind){const base=new URL(kind==='v1'?'preview/static/mobile/':'preview/work/mobile/',location.href);return window.designSystemSources[kind].replace(/<head([^>]*)>/i,'<head$1><base href="'+base.href+'">');}
const base=new URL('preview/static/',location.href),source=document.querySelector('#service-source'),catalog=document.querySelector('#catalog');
const specs=[['스타일 탭','.mark-style-tabs','완등 표시 → 스타일·정렬·연결'],['분할 선택','.order-options:has(#orderByColor)','완등 표시 → 표시 방식 → 색상별·추가순'],['텍스트 탭','#mobile-text-panel>.mobile-text-tabs','텍스트 → 스타일 → 색상·크기·폰트·정렬·테두리·그림자'],['셀렉트박스','#mobile-mark-link','완등 표시 → 연결 → 연결할 글자'],['글자 연결 스위치','.mark-link-switch-row','완등 표시 → 스타일 → 글자와 연결'],['사진 구도 도구','#mobile-image-group-0>.image-tool-strip','이미지 → 구도'],['텍스트 도구','.text-action-strip','텍스트 → 추가·편집·스타일·복제·삭제'],['색상 선택','#mobile-text-group-5 .color-picker-row','텍스트 → 색상·크기'],['크기 슬라이더','#mobile-text-group-5 label[for=size]','텍스트 → 색상·크기'],['각도 슬라이더','#mobile-image-group-0 label:has([data-image-setting=tilt])','이미지 → 구도 → 각도'],['글자 정렬','#mobile-text-group-2 .align-control','텍스트 → 정렬'],['폰트 카드','.mobile-font-cards','텍스트 → 폰트'],['전체 작업 기록','.editor-history','이미지 영역 → 전체 작업 되돌리기·다시 실행'],['선택 표시','.text-layer','캔버스 → 선택한 글자의 점선 표시']];
const sheets=['shared/fonts.css','shared/editor.css','mobile/editor.css'];
source.onload=async()=>{
 try{const doc=source.contentDocument;await doc.fonts.ready;const input=doc.querySelector('#text');input.value='완등 한 컷';input.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(resolve=>source.contentWindow.requestAnimationFrame(()=>source.contentWindow.requestAnimationFrame(resolve)));
 for(const [name,selector,where] of specs){const original=doc.querySelector(selector);if(!original){console.warn('구성 요소를 찾지 못했어요: '+name);continue;}const clone=original.cloneNode(true);clone.hidden=false;clone.style.fontSize=source.contentWindow.getComputedStyle(original).fontSize;
 if(selector.includes('mobile-text-panel')){for(const b of clone.querySelectorAll('button'))b.hidden=b.id==='mobile-text-option-0';clone.querySelector('.mobile-edit-done')?.remove();clone.querySelector('[role=tab][aria-selected=true]')?.setAttribute('aria-selected','false');clone.querySelector('#mobile-text-option-5')?.setAttribute('aria-selected','true');}
 if(selector==='.editor-history'){clone.style.position='relative';clone.style.left='auto';clone.style.bottom='auto';clone.style.width='fit-content';}
 if(selector==='.text-layer'){clone.classList.add('is-editor-selected');clone.style.position='relative';clone.style.left='auto';clone.style.top='auto';clone.style.transform='none';clone.style.width='fit-content';clone.style.fontSize='32px';clone.style.setProperty('--selection-line-width','1.25px');clone.style.setProperty('--selection-line-offset','3px');}
 if(selector==='.mobile-font-cards')for(const child of [...clone.children].slice(4))child.remove();
 const section=document.createElement('section'),heading=document.createElement('h2'),frame=document.createElement('iframe');heading.textContent=name;frame.className='sample';frame.title=name+' 실제 서비스 UI';frame.dataset.selector=selector;
 section.append(heading,frame);catalog.append(section);
 frame.onload=()=>{const d=frame.contentDocument,w=frame.contentWindow,panel=d.querySelector('.mobile-panel');const resize=()=>{frame.style.height=Math.ceil(panel.getBoundingClientRect().height+32)+'px'};new w.ResizeObserver(resize).observe(panel);d.fonts.ready.then(resize);
 for(const tabs of d.querySelectorAll('[role=tablist],.order-options,.alignment-options'))for(const b of tabs.querySelectorAll('button'))b.onclick=()=>{for(const other of tabs.querySelectorAll('button'))other.setAttribute(b.hasAttribute('aria-selected')?'aria-selected':'aria-pressed',String(other===b))};
 for(const sw of d.querySelectorAll('[role=switch]'))sw.onclick=()=>sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));
 for(const range of d.querySelectorAll('input[type=range]'))range.oninput=()=>{const out=range.closest('label')?.querySelector('output');if(out)out.value=range.value+(out.textContent.match(/px|%|°/)?.[0]||'')};
 for(const root of d.querySelectorAll('.simple-picker')){const trigger=root.querySelector('.gym-trigger'),list=root.querySelector('[role=listbox]'),select=root.querySelector('select');if(!trigger||!list||!select)continue;trigger.onclick=()=>{list.replaceChildren();for(const option of select.options){const item=d.createElement('div');item.className='gym-option';item.role='option';item.tabIndex=0;item.textContent=option.textContent;item.setAttribute('aria-selected',String(option.value===select.value));item.onclick=()=>{select.value=option.value;trigger.textContent=option.textContent;list.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();resize()};item.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')item.click();if(e.key==='ArrowDown')(item.nextElementSibling||list.firstChild).focus();if(e.key==='ArrowUp')(item.previousElementSibling||list.lastChild).focus();if(e.key==='Escape'){list.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();resize()}};list.append(item);}list.hidden=trigger.getAttribute('aria-expanded')==='true';trigger.setAttribute('aria-expanded',String(!list.hidden));if(!list.hidden)list.firstChild?.focus();resize();if(!list.hidden)frame.style.height=panel.getBoundingClientRect().height+list.offsetHeight+48+'px';};}
 resize();};
 frame.srcdoc='<!doctype html><html lang="ko"><head><meta charset="utf-8">'+sheets.map(path=>'<link rel="stylesheet" href="'+new URL(path,base)+'?ds='+Date.now()+'">').join('')+'<style>body{margin:0;background:white!important;overflow:hidden}.mobile-editor{position:relative!important;inset:auto!important;height:auto!important;width:100%!important;margin:0!important;overflow:visible!important;z-index:auto!important}.mobile-tools{padding-top:16px!important;padding-bottom:16px!important}.mobile-panel{display:block!important}.mobile-panel[hidden]{display:none!important}</style></head><body class="mobile-editing"><div class="mobile-editor editing-tool"><div class="mobile-tools"><section class="mobile-panel text-section">'+clone.outerHTML+'</section></div></div></body></html>';
 }

 }catch(e){console.error(e);}
};source.srcdoc=serviceDocument('v1');
</script><script data-v2-calendar-sample>
// Render the approved calendar directly from the current service DOM and styles.
(()=>{
 const source=document.createElement('iframe');source.title='v2 달력 UI 원본';source.tabIndex=-1;source.setAttribute('aria-hidden','true');source.style.cssText='position:absolute;left:-10000px;top:0;width:402px;height:874px;border:0;visibility:hidden';
 source.onload=()=>{
  const doc=source.contentDocument,calendar=doc.querySelector('.wc-pad');if(!calendar)return;
  const section=document.createElement('section');section.innerHTML='<h2>v2 달력 · 날짜와 암장 로고</h2>';
  const frame=document.createElement('iframe');frame.className='sample';frame.title='v2 실제 달력';section.append(frame);document.querySelector('#catalog').append(section);
  const styles=[...doc.querySelectorAll('style')].map(x=>x.outerHTML).join('')+[...doc.querySelectorAll('link[rel=stylesheet]')].map(x=>'<link rel="stylesheet" href="'+x.href+'">').join('');
  frame.onload=()=>{const update=()=>{frame.style.height=Math.ceil(frame.contentDocument.body.scrollHeight)+'px'};new frame.contentWindow.ResizeObserver(update).observe(frame.contentDocument.body);frame.contentDocument.fonts.ready.then(update);update()};
  frame.srcdoc='<!doctype html><html lang="ko"><head><base href="'+new URL('preview/work/mobile/',location.href).href+'">'+styles+'<style>body{margin:0;background:white}#wandeung-calendar{padding:0;min-height:0}#wandeung-calendar .wc-phone.wc-calendar-open{height:874px;min-height:0;border:0;box-shadow:none}</style></head><body><div id="wandeung-calendar">'+(doc.querySelector('#wandeung-calendar>svg')?.outerHTML||'')+'<div class="wc-phone wc-calendar-open">'+(doc.querySelector('.wc-device-top')?.outerHTML||'')+'<main id="wc-main">'+calendar.outerHTML+'</main>'+(doc.querySelector('.wc-nav')?.outerHTML||'')+(doc.querySelector('.wc-device-bottom')?.outerHTML||'')+'</div></div></body></html>';
 };
 source.srcdoc=serviceDocument('v2');document.body.append(source);
})();
</script><script data-service-screen-samples>
// Reuse actual service DOM/CSS for each screen rather than maintaining lookalikes.
(()=>{
 const scenarios=[['일정·기록 작성','form'],['기록 상세','detail'],['썸네일','thumbnail'],['썸네일 편집','editor'],['정보','info'],['프로필 편집','profile-edit'],['회원권','memberships'],['회원권 상세','membership-detail'],['회원권 등록','membership-form']];
 for(const [name,route] of scenarios){
  const source=document.createElement('iframe');source.setAttribute('aria-hidden','true');source.tabIndex=-1;source.style.cssText='position:absolute;left:-10000px;top:0;width:402px;height:874px;visibility:hidden';
  source.onload=()=>{
   const doc=source.contentDocument,click=selector=>doc.querySelector(selector)?.click();
   if(route==='editor'){click('[data-menu="thumbnail"]');click('[data-action="new-thumbnail"]');}
   else if(route==='profile-edit'){click('[data-menu="info"]');click('[data-profile-action="edit"]');click('[data-profile-action="date-toggle"]');}
   else if(route==='thumbnail'||route==='info')click('[data-menu="'+route+'"]');
   else if(route==='membership-detail'){click('[data-menu="info"]');click('[data-membership-action="detail"]');}
   else if(route==='memberships'||route==='membership-form'){click('[data-menu="info"]');click('[data-membership-action="open"]');if(route==='membership-form')click('[data-membership-action="add"]');}
   else{const date=doc.querySelector('.wc-day-status')?.closest('[data-date]')||doc.querySelector('[data-date]');date?.click();if(route==='form')click('[data-action="add"]');else click('[data-open]');}
   const phone=doc.querySelector('.wc-phone');if(!phone)return;
   const section=document.createElement('section'),heading=document.createElement('h2'),frame=document.createElement('iframe');heading.textContent=name;frame.title=name;frame.className='sample';frame.style.height='906px';
   // Keep the embedded editor sample live: its header actions use the actual
   // parent/child bridge, not a disconnected clone of the iframe and buttons.
   if(route==='editor'){
    source.removeAttribute('aria-hidden');source.removeAttribute('tabindex');source.style.cssText='height:906px';source.title=name;source.className='sample';
    section.append(heading,source);document.querySelector('#catalog').append(section);return;
   }
   const styles=[...doc.querySelectorAll('link[rel=stylesheet]')].map(x=>'<link rel="stylesheet" href="'+x.href+'">').join('')+[...doc.querySelectorAll('style')].map(x=>x.outerHTML).join('');
   frame.srcdoc='<!doctype html><html lang="ko"><head><meta charset="utf-8">'+styles+'<style>body{margin:0;background:white}#wandeung-calendar{padding:16px 0;min-height:0}.wc-phone{height:874px!important}</style></head><body><div id="wandeung-calendar">'+(doc.querySelector('#wandeung-calendar>svg')?.outerHTML||'')+phone.outerHTML+'</div></body></html>';
   if(route==='memberships'){
    const nav=doc.querySelector('.wc-header'),foundation=document.createElement('section'),sample=document.createElement('iframe');
    foundation.innerHTML='<h2>상단 내비게이션 바</h2>';
    sample.className='sample';sample.title='실제 서비스 상단 내비게이션 바';sample.style.height='80px';
    sample.srcdoc='<!doctype html><html lang="ko"><head>'+styles+'<style>body{margin:0;background:white}#wandeung-calendar{padding:16px 0;min-height:0}#wandeung-calendar .wc-phone{height:auto;min-height:0;border:0;box-shadow:none}</style></head><body><div id="wandeung-calendar"><div class="wc-phone">'+nav.outerHTML+'</div></div></body></html>';
    foundation.append(sample);document.querySelector('#catalog').append(foundation);
    const menuFoundation=document.createElement('section'),menuSample=document.createElement('iframe'),menu=doc.querySelector('.wc-nav');
    menuFoundation.innerHTML='<h2>하단 플로팅 메뉴</h2>';
    menuSample.className='sample';menuSample.title='하단 메뉴 기본과 축소 상태';menuSample.style.height='208px';
    menuSample.srcdoc='<!doctype html><html lang="ko"><head>'+styles+'<style>body{margin:0;background:white}#wandeung-calendar{padding:8px 0;min-height:0;display:flex;flex-direction:column;gap:8px}#wandeung-calendar .wc-phone{--device-safe-bottom:0px;height:92px;min-height:0;border:0;box-shadow:none;background:var(--frame-soft-background)}</style></head><body><div id="wandeung-calendar"><div class="wc-phone">'+menu.outerHTML+'</div><div class="wc-phone wc-menu-compact">'+menu.outerHTML+'</div></div></body></html>';
    menuSample.addEventListener('load',()=>{
     menuSample.contentDocument.querySelectorAll('.wc-nav').forEach(nav=>{
      nav.querySelectorAll('[data-menu]').forEach(button=>button.addEventListener('click',()=>{
       nav.setAttribute('data-selected',button.dataset.menu);
       nav.querySelectorAll('[data-menu]').forEach(item=>item.setAttribute('aria-current',item===button?'page':'false'));
      }));
     });
    });
    menuFoundation.append(menuSample);document.querySelector('#catalog').append(menuFoundation);
   }
   if(route==='form'){
    const title=doc.querySelector('.wc-record-exercise .wc-ui-title'),memo=doc.querySelector('.wc-record-memo');
    if(title&&memo){
     const foundation=document.createElement('section'),sample=document.createElement('iframe');sample.className='sample';sample.title='Title UI와 placeholder 실제 서비스 예시';sample.style.height='150px';
     foundation.innerHTML='<h2>Title UI · Placeholder</h2>';
     const input=memo.cloneNode(true);input.querySelector('textarea').value='';input.querySelector('textarea').textContent='';
     sample.srcdoc='<!doctype html><html lang="ko"><head>'+styles+'<style>body{margin:0;background:white}#wandeung-calendar{padding:16px;min-height:0;display:block}</style></head><body><div id="wandeung-calendar">'+title.outerHTML+input.outerHTML+'</div></body></html>';
     foundation.append(sample);document.querySelector('#catalog').append(foundation);
    }
   }
   section.append(heading,frame);document.querySelector('#catalog').append(section);source.remove();
  };
  source.srcdoc=serviceDocument('v2');document.body.append(source);
 }
})();
</script>
</body></html>
