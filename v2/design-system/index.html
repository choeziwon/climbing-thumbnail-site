<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>완등 한 컷 · 실제 UI 디자인 시스템</title><link rel="stylesheet" href="../editor/shared/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111;font-family:Pretendard,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:40px 24px 80px}h1{font:32px Wave;margin:0 0 14px}p{font-size:14px;line-height:1.7;color:#737780}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}section{min-width:0;padding:24px;background:white;border:1px solid #e7e8eb;border-radius:16px}h2{font-size:18px;margin:0 0 8px}.source{font:12px/1.6 Pretendard;color:#737780;margin:0 0 18px}iframe.sample{border:0;display:block;width:100%;min-height:60px;background:white}.tokens{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.token{font-size:12px;line-height:1.6}.token i{display:block;height:48px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px}#service-source{position:absolute;left:-10000px;top:0;width:402px;height:874px;border:0;visibility:hidden}#status{margin-bottom:24px}a{color:inherit}@media(max-width:720px){main{padding:28px 16px}.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>완등 한 컷</h1><p>실제 서비스 UI를 기준으로 정리한 디자인 시스템</p><p id="status">서비스에서 사용 중인 구성 요소를 불러오는 중이에요.</p><div class="grid" id="catalog"></div></main><iframe id="service-source" title="서비스 UI 원본" tabindex="-1" aria-hidden="true"></iframe>
<script>
const base=new URL('../editor/',location.href),source=document.querySelector('#service-source'),catalog=document.querySelector('#catalog');
const specs=[['스타일 탭','.mark-style-tabs','완등 표시 → 스타일·정렬·연결'],['분할 선택','.order-options:has(#orderByColor)','완등 표시 → 표시 방식 → 색상별·추가순'],['텍스트 탭','#mobile-text-panel>.mobile-text-tabs','텍스트 → 스타일 → 색상·크기·폰트·정렬·테두리·그림자'],['셀렉트박스','#mobile-mark-link','완등 표시 → 연결 → 연결할 글자'],['글자 연결 스위치','.mark-link-switch-row','완등 표시 → 스타일 → 글자와 연결'],['사진 구도 도구','#mobile-image-group-0>.image-tool-strip','이미지 → 구도'],['텍스트 도구','.text-action-strip','텍스트 → 추가·내용 편집·스타일·복제·삭제'],['색상 선택','#mobile-text-group-5 .color-picker-row','텍스트 → 색상·크기'],['크기 슬라이더','#mobile-text-group-5 label[for=size]','텍스트 → 색상·크기'],['각도 슬라이더','#mobile-image-group-0 label:has([data-image-setting=tilt])','이미지 → 구도 → 각도'],['글자 정렬','#mobile-text-group-2 .align-control','텍스트 → 정렬'],['폰트 카드','.mobile-font-cards','텍스트 → 폰트'],['전체 작업 기록','.editor-history','이미지 영역 → 전체 작업 되돌리기·다시 실행'],['선택 표시','.text-layer','캔버스 → 선택한 글자의 점선 표시']];
const sheets=['shared/fonts.css','shared/editor.css','mobile/editor.css'];
source.onload=async()=>{
 try{const doc=source.contentDocument;await doc.fonts.ready;const input=doc.querySelector('#text');input.value='완등 한 컷';input.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(resolve=>source.contentWindow.requestAnimationFrame(()=>source.contentWindow.requestAnimationFrame(resolve)));
 const shell=doc.querySelector('.mobile-editor'),computed=source.contentWindow.getComputedStyle(shell);
 const tokens=[['기본 글자','color','#111111'],['컨트롤 표면','--control-surface'],['컨트롤 구분선','--control-border'],['선택 배경','--selection-bg'],['탭 선택 배경','--tab-selection-bg'],['탭 선택 글자','--tab-selection-ink']];
 const card=document.createElement('section');card.innerHTML='<h2>서비스 색상 토큰</h2><p class="source">현재 서비스의 계산된 스타일에서 읽은 값</p><div class="tokens"></div>';for(const [name,key,fallback] of tokens){const value=fallback||computed.getPropertyValue(key).trim(),item=document.createElement('div');item.className='token';item.innerHTML='<i></i>';item.firstChild.style.background=value;item.append(name,document.createElement('br'),value);card.lastChild.append(item);}catalog.append(card);
 for(const [name,selector,where] of specs){const original=doc.querySelector(selector);if(!original)throw Error('구성 요소를 찾지 못했어요: '+name);const clone=original.cloneNode(true);clone.hidden=false;clone.style.fontSize=source.contentWindow.getComputedStyle(original).fontSize;
 if(selector.includes('mobile-text-panel')){for(const b of clone.querySelectorAll('button'))b.hidden=b.id==='mobile-text-option-0';clone.querySelector('.mobile-edit-done')?.remove();clone.querySelector('[role=tab][aria-selected=true]')?.setAttribute('aria-selected','false');clone.querySelector('#mobile-text-option-5')?.setAttribute('aria-selected','true');}
 if(selector==='.editor-history'){clone.style.position='relative';clone.style.left='auto';clone.style.bottom='auto';clone.style.width='fit-content';}
 if(selector==='.text-layer'){clone.classList.add('is-editor-selected');clone.style.position='relative';clone.style.left='auto';clone.style.top='auto';clone.style.transform='none';clone.style.width='fit-content';clone.style.fontSize='32px';clone.style.setProperty('--selection-line-width','1.25px');clone.style.setProperty('--selection-line-offset','3px');}
 if(selector==='.mobile-font-cards')for(const child of [...clone.children].slice(4))child.remove();
 const section=document.createElement('section'),heading=document.createElement('h2'),label=document.createElement('p'),frame=document.createElement('iframe');heading.textContent=name;label.className='source';label.textContent=where;frame.className='sample';frame.title=name+' 실제 서비스 UI';frame.dataset.selector=selector;
 section.append(heading,label,frame);catalog.append(section);
 frame.onload=()=>{const d=frame.contentDocument,w=frame.contentWindow,panel=d.querySelector('.mobile-panel');const resize=()=>{frame.style.height=Math.ceil(panel.getBoundingClientRect().height+32)+'px'};new w.ResizeObserver(resize).observe(panel);d.fonts.ready.then(resize);
 for(const tabs of d.querySelectorAll('[role=tablist],.order-options,.alignment-options'))for(const b of tabs.querySelectorAll('button'))b.onclick=()=>{for(const other of tabs.querySelectorAll('button'))other.setAttribute(b.hasAttribute('aria-selected')?'aria-selected':'aria-pressed',String(other===b))};
 for(const sw of d.querySelectorAll('[role=switch]'))sw.onclick=()=>sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));
 for(const range of d.querySelectorAll('input[type=range]'))range.oninput=()=>{const out=range.closest('label')?.querySelector('output');if(out)out.value=range.value+(out.textContent.match(/px|%|°/)?.[0]||'')};
 for(const root of d.querySelectorAll('.simple-picker')){const trigger=root.querySelector('.gym-trigger'),list=root.querySelector('[role=listbox]'),select=root.querySelector('select');if(!trigger||!list||!select)continue;trigger.onclick=()=>{list.replaceChildren();for(const option of select.options){const item=d.createElement('div');item.className='gym-option';item.role='option';item.tabIndex=0;item.textContent=option.textContent;item.setAttribute('aria-selected',String(option.value===select.value));item.onclick=()=>{select.value=option.value;trigger.textContent=option.textContent;list.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();resize()};item.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')item.click();if(e.key==='ArrowDown')(item.nextElementSibling||list.firstChild).focus();if(e.key==='ArrowUp')(item.previousElementSibling||list.lastChild).focus();if(e.key==='Escape'){list.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();resize()}};list.append(item);}list.hidden=trigger.getAttribute('aria-expanded')==='true';trigger.setAttribute('aria-expanded',String(!list.hidden));if(!list.hidden)list.firstChild?.focus();resize();if(!list.hidden)frame.style.height=panel.getBoundingClientRect().height+list.offsetHeight+48+'px';};}
 resize();};
 frame.srcdoc='<!doctype html><html lang="ko"><head><meta charset="utf-8">'+sheets.map(path=>'<link rel="stylesheet" href="'+new URL(path,base)+'?ds='+Date.now()+'">').join('')+'<style>body{margin:0;background:white!important;overflow:hidden}.mobile-editor{position:relative!important;inset:auto!important;height:auto!important;width:100%!important;margin:0!important;overflow:visible!important;z-index:auto!important}.mobile-tools{padding-top:16px!important;padding-bottom:16px!important}.mobile-panel{display:block!important}.mobile-panel[hidden]{display:none!important}</style></head><body class="mobile-editing"><div class="mobile-editor editing-tool"><div class="mobile-tools"><section class="mobile-panel text-section">'+clone.outerHTML+'</section></div></div></body></html>';
 }
 document.querySelector('#status').textContent='기준: 실제 서비스 화면 → 생성한 UI. 아래 예시는 서비스 DOM과 CSS를 직접 가져옵니다.';
 }catch(e){document.querySelector('#status').textContent=e.message;throw e;}
};source.src=new URL('mobile/?design-system=1',base);
</script><script data-v2-calendar-sample>
// Render the approved calendar directly from the current service DOM and styles.
(()=>{
 const source=document.createElement('iframe');source.title='v2 달력 UI 원본';source.tabIndex=-1;source.setAttribute('aria-hidden','true');source.style.cssText='position:absolute;left:-10000px;top:0;width:402px;height:874px;border:0;visibility:hidden';
 source.onload=()=>{
  const doc=source.contentDocument,calendar=doc.querySelector('.wc-pad');if(!calendar)return;
  const section=document.createElement('section');section.innerHTML='<h2>v2 달력 · 날짜와 암장 로고</h2><p class="source">2026-11-04 승인 · 날짜 12/16px · 로고 42px · 날짜 칸은 92px을 기준으로 상하 패딩 6px·숫자와 로고 간격 4px을 동일하게 유지하고, 화면 여백을 채우려고 늘리지 않습니다. 작은 화면에서만 칸과 로고를 축소합니다. 다음 달 날짜는 빈칸으로 표시합니다. 600px 이하 너비는 전체 뷰포트, 700px 이하 높이는 압축 간격을 사용합니다, 행 간격 2px. 하단 탭은 24px 아이콘·14px 이름, 버튼 최소 62px. 실제 한국 날짜로 표시하고 날짜 내역은 YYYY.MM.DD 형식을 사용합니다. 월별 대시보드는 달력 콘텐츠 하단 패딩 4px을 두고 배치하고 세 열의 너비·안쪽 간격을 동일하게 맞춥니다. 숫자와 단위 간격은 2px, 패딩 12px·제목과 값 간격 2px인 기존 방문 통계 카드의 3열 구성으로 방문횟수·완등수·방문 암장수를 표시합니다. 예정·미래 기록은 제외하고 지점명 별칭은 합산합니다. 오늘은 숫자 테두리 배지, 선택일은 숫자 검정 배지를 사용합니다. 날짜를 누르면 내역은 하단 패널(상하 패딩 20px·좌우 16px, 공통 높이 220px·최대 65%, 제목 행 gap 0px·본문 간격 4px, 일정 유무와 관계없이 같은 크기, 상단 모서리 20px, 배경·Escape로 닫기, × 버튼 없음, 날짜 제목 16/24px·추가 버튼은 44px 터치 영역의 24px plus 아이콘)로 표시합니다. 썸네일 홈의 소개 제목·설명은 표시하지 않고 바로 만들기 카드로 시작합니다. 캘린더·썸네일·정보의 공통 브랜드/와이어프레임 헤더는 제거하고 달력 제목 오른쪽에는 기존 도구 아이콘 버튼 스타일의 보기 전환·공유 버튼을 줄바꿈 없이 한 줄로 나란히 표시합니다. 월간에서 layout-grid(연간 보기로 전환), 연간에서 calendar-days(월간 보기로 전환)를 사용하며 아이콘18px·버튼44×36px입니다. 세그먼트 탭은 표시하지 않습니다. 연간은 3열×4행의 12개월 달력으로 요일과 날짜 숫자는 표시하지 않고 날짜의 격자 위치만 유지합니다. 실제 날짜마다 정사각형 칸을 두고 방문 완료일은 암장 로고, 미방문일은 기존 soft-background 토큰의 아주 밝은 회색 빈칸으로 표시합니다. 월 시작 전 자리는 배경 없이 비웁니다. 월간도 일정 없는 현재 월 날짜의 로고 자리에 같은 soft-background 회색 네모를 로고와 같은 크기로 표시합니다. 월간의 날짜 숫자와 요일은 유지합니다. 날짜 호버 시 빈 네모는 control-border 토큰(#d9dde3)으로 진해져 호버 배경과 구분됩니다. 같은 날 여러 방문은 첫 로고와 점으로 표시하며 월을 누르면 해당 월간으로 이동합니다. 최소 월 높이118px을 확보하고 작은 화면은 연간 본문만 내부 스크롤합니다. 두 보기 모두 제목을 누르면 연·월 선택 하단 패널을 엽니다. 기존 날짜 내역 패널의 배경·모서리·패딩을 재사용하고 연도 좌우 이동과 3열 12개월 버튼을 표시합니다. 선택 연도는 20px/28px로 표시합니다. 월 선택 즉시 해당 월로 이동하고 닫힙니다. 배경·Escape로 취소합니다. 가까운 달은 좌우 스와이프, 새로고침은 월간 오늘 날짜로 복귀합니다. 새로고침·공유 아이콘은 18px/44px 터치 영역입니다. 달력 콘텐츠의 위 패딩은 0px이며 하단 탭바 위 구분선은 없습니다. 하단 메뉴 버튼의 호버 모서리는 8px입니다. 캘린더·썸네일·정보는 아이폰 18 Pro 미리보기 기준 402×874px 공통 프레임 안에 상단 62px 상태바/카메라 영역과 하단 34px 홈 인디케이터를 포함하고 긴 내용만 내부 스크롤합니다. 실제 v2 DOM과 CSS를 불러옵니다.</p>';
  const frame=document.createElement('iframe');frame.className='sample';frame.title='v2 실제 달력';section.append(frame);document.querySelector('#catalog').append(section);
  const styles=[...doc.querySelectorAll('style')].map(x=>x.outerHTML).join('')+[...doc.querySelectorAll('link[rel=stylesheet]')].map(x=>'<link rel="stylesheet" href="'+x.href+'">').join('');
  frame.onload=()=>{const update=()=>{frame.style.height=Math.ceil(frame.contentDocument.body.scrollHeight)+'px'};new frame.contentWindow.ResizeObserver(update).observe(frame.contentDocument.body);frame.contentDocument.fonts.ready.then(update);update()};
  frame.srcdoc='<!doctype html><html lang="ko"><head><base href="'+new URL('../',location.href).href+'">'+styles+'<style>body{margin:0;background:white}#wandeung-calendar{padding:0;min-height:0}#wandeung-calendar .wc-phone.wc-calendar-open{height:874px;min-height:0;border:0;box-shadow:none}</style></head><body><div id="wandeung-calendar">'+(doc.querySelector('#wandeung-calendar>svg')?.outerHTML||'')+'<div class="wc-phone wc-calendar-open">'+(doc.querySelector('.wc-device-top')?.outerHTML||'')+'<main id="wc-main">'+calendar.outerHTML+'</main>'+(doc.querySelector('.wc-nav')?.outerHTML||'')+(doc.querySelector('.wc-device-bottom')?.outerHTML||'')+'</div></div></body></html>';
 };
 source.src=new URL('../index.html',location.href);document.body.append(source);
})();
</script></body></html>
