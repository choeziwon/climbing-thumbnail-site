let gymPosition=null;
let gymLocationState='idle';
let gymLocationRequest=0;
let gymLocationPermissionWaiting=false;
function gymDistance(gym,position=gymPosition){
  const lat=Number(gym.geo?.latitude),lon=Number(gym.geo?.longitude);
  if(!position||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return Infinity;
  const rad=Math.PI/180,dLat=(lat-position.latitude)*rad,dLon=(lon-position.longitude)*rad;
  const h=Math.sin(dLat/2)**2+Math.cos(position.latitude*rad)*Math.cos(lat*rad)*Math.sin(dLon/2)**2;
  return 6371*2*Math.asin(Math.sqrt(Math.min(1,Math.max(0,h))));
}
function gymLocationControl(){
  const labels={idle:'내 위치에서 가까운 암장 찾기',loading:'위치 확인 중…',ready:'가까운 순 · 직선거리',denied:'기기와 브라우저 설정에서 위치 접근을 허용해 주세요.',unavailable:'기기에서 위치를 받지 못했어요. 위치 서비스와 인터넷 연결을 확인해 주세요.',timeout:'위치 확인이 오래 걸리고 있어요. 다시 시도해 주세요.',error:'위치를 확인하지 못했어요. 다시 시도해 주세요.',unsupported:'이 브라우저에서는 위치를 사용할 수 없어요.',blocked:'이 페이지에서 위치 접근이 제한되어 있어요.'};
  const failed=!['idle','loading','ready'].includes(gymLocationState);

function refreshGymLocation(){
  if(page!=='form'||!draft)return;
  const control=root.querySelector('#wc-gym-location'),results=root.querySelector('#wc-gym-results');

}
function requestGymLocation(){
  if(gymLocationState==='loading')return;
  gymPosition=null;
  if(typeof navigator==='undefined'||!navigator.geolocation){gymLocationState='unsupported';refreshGymLocation();return;}
  const policy=document.permissionsPolicy||document.featurePolicy;
  if((typeof isSecureContext!=='undefined'&&!isSecureContext)||policy?.allowsFeature?.('geolocation')===false){gymPosition=null;gymLocationState='blocked';refreshGymLocation();return;}
  const request=++gymLocationRequest;
  gymLocationPermissionWaiting=false;
  // Never continue showing distances from a previous fix while refreshing or after failure.
  gymLocationState='loading';refreshGymLocation();
  function locate(highAccuracy){
    let settled=false;
    let watchdog=null,permission=null;
    const timeout=highAccuracy?15000:8000;
    // A browser's native location timeout excludes permission/visibility waits.
    // The extra guard for silent hosts must respect those waits too.
    function updateDeadline(){
      if(settled||request!==gymLocationRequest)return;
      clearTimeout(watchdog);watchdog=null;
      const waiting=permission?.state==='prompt';
      if(gymLocationPermissionWaiting!==waiting){gymLocationPermissionWaiting=waiting;refreshGymLocation();}
      if(permission?.state==='denied'){fail({code:1});return;}
      if(waiting||document.visibilityState==='hidden')return;
      watchdog=setTimeout(()=>fail({code:3}),timeout+1000);
    }
    function settle(){
      if(settled||request!==gymLocationRequest)return false;
      settled=true;clearTimeout(watchdog);
      permission?.removeEventListener?.('change',updateDeadline);
      document.removeEventListener?.('visibilitychange',updateDeadline);
      gymLocationPermissionWaiting=false;
      return true;
    }

      if(!settle())return;
      if(!highAccuracy&&(error?.code===2||error?.code===3)){locate(true);return;}
      gymLocationState=error?.code===1?'denied':error?.code===2?'unavailable':error?.code===3?'timeout':'error';
      refreshGymLocation();
    }
    document.addEventListener?.('visibilitychange',updateDeadline);
    updateDeadline();
    try{
      // Do not await this query: getCurrentPosition must retain the click gesture.
      navigator.permissions?.query({name:'geolocation'}).then(status=>{
        if(settled||request!==gymLocationRequest)return;
        permission=status;permission.addEventListener?.('change',updateDeadline);updateDeadline();
      }).catch(()=>{});
    }catch{}
    try{
      navigator.geolocation.getCurrentPosition(pos=>{
        if(!settle())return;
        const {latitude,longitude}=pos?.coords||{};
        if(!Number.isFinite(latitude)||!Number.isFinite(longitude)||Math.abs(latitude)>90||Math.abs(longitude)>180)gymLocationState='error';

      },fail,{enableHighAccuracy:highAccuracy,timeout,maximumAge:highAccuracy?0:60000});
    }catch(error){fail({code:error?.name==='SecurityError'?1:0});}
  }

}

const gymSearchIndex = gymCatalog.map(g=>({...g,searchKey:[g.name,...g.aliases,g.region].map(gymKey).join('|')}));
function gymChoices(query='',limit=20) {
  const key=gymKey(query),seen=new Set();
  // Recent records only promote a catalogued branch; never reintroduce closed/unknown gyms.
  const recent=items.map(x=>gymCatalog.find(g=>[g.name,...g.aliases].some(a=>gymKey(a)===gymKey(x.gym)))).filter(Boolean);
  const candidates=[...recent,...gymSearchIndex];
  const matched=candidates.filter(g=>{const k=gymKey(g.name);if(seen.has(k))return false;seen.add(k);return !key||(g.searchKey||[g.name,...g.aliases,g.region].map(gymKey).join('|')).includes(key);});
  if(gymPosition)matched.sort((a,b)=>gymDistance(a)-gymDistance(b)||a.name.localeCompare(b.name,'ko'));
  return matched.slice(0,limit);
}
function gymResults(query,limit=20) {
  const matches=gymChoices(query,Infinity),rows=matches.slice(0,limit);

function calendar(){const [y,m]=month.split('-').map(Number),start=new Date(y,m-1,1),startOffset=start.getDay(),days=new Date(y,m,0).getDate(),rows=Math.ceil((startOffset+days)/7);let cells=['일','월','화','수','목','금','토'].map(x=>`<span class="wc-weekday">${x}</span>`).join('');for(let i=0;i<rows*7;i++){const dt=new Date(y,m-1,i-startOffset+1),d=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,events=items.filter(x=>x.date===d),done=events.filter(x=>x.status==='done').length;cells+=`<button class="wc-date ${d===TODAY?'wc-today':''} ${dt.getMonth()!==m-1?'wc-out':''}" data-date="${d}" aria-pressed="${d===selectedDate}" aria-label="${dateLabel(d)}${d===TODAY?' 오늘':''}, 예정 ${events.length-done}개, 다녀옴 ${done}개"><span>${dt.getDate()}</span><span class="wc-day-gyms">${events.slice(0,1).map(x=>`<span class="wc-day-status">${gymLogo(x.gym,true)}<span class="wc-dot ${x.status==='done'?'done':''}"></span></span>`).join('')}${events.length>1?`<span class="wc-day-more">+${events.length-1}</span>`:''}</span></button>`;}

try{const saved=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');if(saved&&typeof saved==='object')for(const key of Object.keys(profile))if(typeof saved[key]==='string')profile[key]=saved[key];}catch{}
let savedProfile={...profile},editingSection='';
const sectionKeys={profile:['nickname','photo','reach','armReach'],start:['startDate']};
const safePhoto=()=>/^data:image\/(jpeg|png|webp);base64,/.test(profile.photo)?profile.photo:'';
function climbingExperience(start,end=TODAY){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||start>end)return null;
  const [sy,sm,sd]=start.split('-').map(Number),[ey,em,ed]=end.split('-').map(Number);
  const startUTC=Date.UTC(sy,sm-1,sd),endUTC=Date.UTC(ey,em-1,ed);
  const valid=new Date(startUTC);if(valid.getUTCFullYear()!==sy||valid.getUTCMonth()!==sm-1||valid.getUTCDate()!==sd)return null;
  let months=(ey-sy)*12+em-sm;
  const anniversaryDay=Math.min(sd,new Date(Date.UTC(ey,em,0)).getUTCDate());
  if(ed<anniversaryDay)months--;
  return {days:Math.floor((endUTC-startUTC)/86400000)+1,years:Math.floor(months/12),months:months%12};
}
function experienceMarkup(){
  const experience=climbingExperience(profile.startDate);
  const title=experience?`클라이밍 ${experience.days.toLocaleString('ko-KR')}일째`:'클라이밍 시작일';
  return `${sectionHeading(title,'start')}<div class="wc-experience-details">${experience?`<span>${esc(profile.startDate.replaceAll('-','. '))} 시작</span><span>${experience.years}년 ${experience.months}개월</span>`:'<span class="wc-muted">미등록</span>'}</div>`;
}
function sectionHeading(title,key){

}
function sectionActions(key){return editingSection===key?`<p id="wc-profile-error" class="wc-error" role="alert">${esc(profileError)}</p><div class="wc-section-actions"><button data-profile-action="cancel" ${photoBusy?'disabled':''}>취소</button><button class="wc-primary" data-profile-action="save" ${photoBusy?'disabled':''}>저장</button></div>`:'';}
function avatarMarkup(){return `<div class="wc-avatar">${safePhoto()?`<img src="${esc(safePhoto())}" alt="내 프로필 사진">`:'<i data-lucide="user-round" aria-hidden="true"></i>'}</div>`;}
function bodyMarkup(editing){return `<div class="wc-body-fields">${[['reach','리치'],['armReach','암리치']].map(([key,label])=>editing?`<label class="wc-info-field">${label}<div class="wc-unit-field"><input data-profile-field="${key}" type="number" inputmode="decimal" min="1" max="400" step="0.1" placeholder="입력" aria-label="${label} cm" value="${esc(profile[key])}"><span aria-hidden="true">cm</span></div></label>`:`<div class="wc-body-value"><span class="wc-muted">${label}</span><p>${profile[key]?`${esc(profile[key])} <span>cm</span>`:'<span class="wc-muted">미등록</span>'}</p></div>`).join('')}</div>`;}
// One completed calendar record represents one visit, even on the same day.
function visitTotals(records=items,today=membershipToday()){
  const currentMonth=today.slice(0,7);
  return records.reduce((totals,record)=>{
    if(record?.status!=='done'||typeof record.date!=='string'||!Number.isFinite(membershipDay(record.date))||record.date>today)return totals;
    totals.total++;
    if(record.date.slice(0,7)===currentMonth)totals.month++;
    return totals;
  },{month:0,total:0});
}
function visitsMarkup(){
  const today=membershipToday(),totals=visitTotals(items,today);
  return `<section class="wc-info-section wc-visit-summary" aria-label="방문 통계"><div><span class="wc-muted" aria-label="${today.slice(0,4)}년 ${Number(today.slice(5,7))}월 방문">이번 달 방문</span><p><strong data-visit-stat="month">${totals.month.toLocaleString('ko-KR')}</strong><span>회</span></p></div><div><span class="wc-muted">누적 방문</span><p><strong data-visit-stat="total">${totals.total.toLocaleString('ko-KR')}</strong><span>회</span></p></div></section>`;
}
function info(){

  return `<div class="wc-info-panel">

      ${profileEditing?`<div class="wc-profile-edit-fields"><label class="wc-info-field">닉네임<input name="nickname" data-profile-field="nickname" maxlength="24" placeholder="닉네임을 입력해 주세요" value="${esc(profile.nickname)}" autocomplete="nickname"></label>${bodyMarkup(true)}</div>`:''}${sectionActions('profile')}</section>

    </section>
    ${visitsMarkup()}
    </div>`;
}
function saveProfile(){
  profileError='';
  if(editingSection==='start'&&profile.startDate&&!climbingExperience(profile.startDate))profileError='시작일은 오늘 또는 지난 날짜로 입력해 주세요.';
  if(editingSection==='profile')for(const key of ['reach','armReach'])if(profile[key]!==''&&(!Number.isFinite(Number(profile[key]))||Number(profile[key])<=0||Number(profile[key])>400))profileError='리치와 암리치는 0보다 크고 400 이하인 cm 값으로 입력해 주세요.';
  if(profileError){root.querySelector('#wc-profile-error').textContent=profileError;return;}
  profile.nickname=profile.nickname.trim();

  render();
}
async function selectProfilePhoto(file){
  if(!file)return;
  if(!file.type.startsWith('image/')){profileError='이미지 파일을 선택해 주세요.';render();return;}
  photoBusy=true;profileError='';render();
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
    const size=Math.min(img.naturalWidth,img.naturalHeight),ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,256,256);
    ctx.drawImage(img,(img.naturalWidth-size)/2,(img.naturalHeight-size)/2,size,size,0,0,256,256);
    profile.photo=canvas.toDataURL('image/jpeg',.88);

  }catch{profileError='사진을 읽지 못했어요. JPG 또는 PNG 사진으로 다시 선택해 주세요.';}
  finally{URL.revokeObjectURL(url);photoBusy=false;if(page==='info')render();}
}

// Local prototype memberships are kept separate from profile data.
const MEMBERSHIP_KEY='wandeung-preview-memberships-v1';
let memberships=[],membershipDraft=null,membershipError='';
function membershipDay(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return NaN;
  const date=new Date(value+'T00:00:00Z');
  return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value?date.getTime()/86400000:NaN;
}
function membershipToday(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
try{const stored=JSON.parse(localStorage.getItem(MEMBERSHIP_KEY)||'[]');if(Array.isArray(stored))memberships=stored.filter(item=>item&&['id','gym','kind','start','end'].every(key=>typeof item[key]==='string')&&Number.isFinite(membershipDay(item.start))&&Number.isFinite(membershipDay(item.end))&&item.end>=item.start);}catch{}
function membershipStatus(item){
  const today=membershipDay(membershipToday()),remaining=membershipDay(item.end)-today,startIn=membershipDay(item.start)-today;
  if(remaining<0)return {label:'만료',detail:'',expired:true};
  if(startIn>0)return {label:'시작 전',detail:`${startIn}일 후 시작 · 만료까지 ${remaining}일`,expired:false};
  return {label:remaining===0?'오늘 만료':`${remaining}일 남음`,detail:'',expired:false};
}
function membershipForm(){return `<div class="wc-membership-form">${[['gym','암장명','예: 더클라임 연남'],['kind','회원권 종류','예: 1개월권, 10회권']].map(([key,label,placeholder])=>`<label class="wc-info-field">${label}<input data-membership-field="${key}" maxlength="80" value="${esc(membershipDraft[key])}" placeholder="${placeholder}" required></label>`).join('')}<div class="wc-membership-dates">${[['start','시작일'],['end','만료일']].map(([key,label])=>`<label class="wc-info-field">${label}<input type="date" data-membership-field="${key}" value="${esc(membershipDraft[key])}" required></label>`).join('')}</div><p id="wc-membership-error" class="wc-error" role="alert">${esc(membershipError)}</p><div class="wc-section-actions"><button data-membership-action="cancel">취소</button><button class="wc-primary" data-membership-action="save">저장</button></div></div>`;}
function membershipSummary(){
  const active=memberships.filter(item=>!membershipStatus(item).expired).length;
  const summary=memberships.length?`사용 가능·예정 ${active}개 · 전체 ${memberships.length}개`:'등록한 회원권이 없어요.';
  return `<section class="wc-info-section"><button class="wc-membership-summary" data-membership-action="open" ${editingSection?'disabled':''} aria-label="회원권 목록 열기"><span><strong>회원권${memberships.length?` <span class="wc-membership-total">${memberships.length}</span>`:''}</strong><span class="wc-muted">${summary}</span></span><span aria-hidden="true">›</span></button></section>`;
}
function membershipPage(){return `<div class="wc-info-panel wc-membership-page">${membershipSection()}</div>`;}
function membershipSection(){
  return `<section class="wc-info-section wc-memberships"><div class="wc-info-heading"><h2>전체 ${memberships.length}개</h2>${membershipDraft?'':`<button class="wc-section-edit" data-membership-action="add" ${editingSection?'disabled':''}>등록</button>`}</div>${membershipDraft&&!membershipDraft.id?membershipForm():''}${memberships.map(item=>{

    return `<article class="wc-membership-card ${status.expired?'is-expired':''}"><div class="wc-membership-card-top"><strong>${esc(item.gym)}</strong><span class="wc-membership-status">${status.label}</span></div><p class="wc-membership-kind">${esc(item.kind)}</p><dl class="wc-membership-period"><div><dt>시작일</dt><dd>${esc(item.start.replaceAll('-','. '))}</dd></div><div><dt>만료일</dt><dd>${esc(item.end.replaceAll('-','. '))}</dd></div></dl>${status.detail?`<p class="wc-muted">${status.detail}</p>`:''}<div class="wc-membership-card-actions"><button data-membership-action="edit" data-membership-id="${esc(item.id)}" ${editingSection?'disabled':''} aria-label="${esc(item.gym)} 회원권 수정">수정</button><button data-membership-action="delete" data-membership-id="${esc(item.id)}" ${editingSection?'disabled':''} aria-label="${esc(item.gym)} 회원권 삭제">삭제</button></div></article>`;
  }).join('')}${!memberships.length&&!membershipDraft?'<div class="wc-membership-empty">등록한 회원권이 없어요.</div>':''}${!membershipDraft&&membershipError?`<p class="wc-error" role="alert">${esc(membershipError)}</p>`:''}</section>`;
}
function commitMemberships(next){try{localStorage.setItem(MEMBERSHIP_KEY,JSON.stringify(next));memberships=next;membershipError='';return true;}catch{membershipError='회원권을 저장하지 못했어요. 다시 시도해 주세요.';return false;}}
root.addEventListener('input',event=>{const key=event.target.dataset.membershipField;if(!membershipDraft||!['gym','kind','start','end'].includes(key))return;membershipDraft[key]=event.target.value;membershipError='';const error=root.querySelector('#wc-membership-error');if(error)error.textContent='';});
root.addEventListener('click',event=>{

  if(action==='save'&&membershipDraft){
    const item={...membershipDraft,gym:membershipDraft.gym.trim(),kind:membershipDraft.kind.trim()};
    if(!item.gym||!item.kind)membershipError='암장명과 회원권 종류를 입력해 주세요.';
    else if(!Number.isFinite(membershipDay(item.start))||!Number.isFinite(membershipDay(item.end)))membershipError='시작일과 만료일을 입력해 주세요.';
    else if(item.end<item.start)membershipError='만료일은 시작일과 같거나 이후여야 해요.';
    else{
      if(!item.id)item.id=crypto.randomUUID();
      const next=memberships.some(saved=>saved.id===item.id)?memberships.map(saved=>saved.id===item.id?item:saved):[...memberships,item];
      if(commitMemberships(next)){membershipDraft=null;editingSection='';}
    }
    render();
  }
  if(action==='delete'&&!editingSection){const item=memberships.find(item=>item.id===id);if(item&&confirm(`${item.gym} 회원권을 삭제할까요?`)){commitMemberships(memberships.filter(item=>item.id!==id));render();}}
});

function render(){const titles={calendar:'완등 한 컷',thumbnail:'완등 한 컷',info:'완등 한 컷',memberships:'회원권',form:draft?.id?'일정·기록 수정':'일정·기록 추가',detail:'일정·기록 상세',pick:'기록 불러오기',editor:'썸네일 편집'};root.querySelector('.wc-phone').classList.toggle('wc-v1-open',page==='editor');root.querySelector('#wc-title').textContent=page==='editor'?'썸네일':titles[page];root.querySelector('#wc-title').classList.toggle('wc-brand',['calendar','thumbnail','info'].includes(page));root.querySelector('#wc-back').hidden=['calendar','thumbnail','info'].includes(page);main.innerHTML=({calendar,form,detail,thumbnail,pick,info,memberships:membershipPage,editor:edit})[page]();root.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-current',b.dataset.menu===menu?'page':'false'));root.querySelectorAll('button').forEach(b=>{b.type='button';b.classList.add('cursor-interaction');});root.querySelector('#wc-status').textContent=notice;root.querySelectorAll('.wc-date').forEach(b=>b.style.height=design.dayHeight+'px');globalThis.lucide?.createIcons({attrs:{width:19,height:19}});const details=root.querySelector('details');if(details)details.addEventListener('toggle',()=>{draft.expanded=details.open;});}
function askLeave(action){if(page==='form'&&draft){confirmAction={action};notice='';root.querySelector('#wc-status').innerHTML='<p>작성 중인 내용을 닫을까요?</p><div class="wc-actions"><button data-action="stay">계속 작성</button><button data-action="leave">닫기</button></div>';root.querySelectorAll('#wc-status button').forEach(b=>b.classList.add('cursor-interaction'));return;}action();}
function openMenu(m){askLeave(()=>{menu=m;go(m);});}
function add(){draft={date:selectedDate,gym:'',time:'',status:selectedDate<TODAY?'done':'planned',counts:[0,0,0],note:'',photo:false,expanded:false};returnPage='calendar';go('form');}
function save(){if(!draft.date||!draft.gym.trim()){root.querySelector('#wc-error').textContent='날짜와 암장명을 입력해 주세요.';return;}if(draft.status==='done'&&draft.date>TODAY){root.querySelector('#wc-error').textContent='다녀온 기록은 오늘 또는 지난 날짜로 남겨주세요.';return;}const item={...draft,gym:draft.gym.trim(),id:draft.id||'record-'+Date.now(),counts:[...draft.counts]};delete item.expanded;const i=items.findIndex(x=>x.id===item.id);if(i<0)items.push(item);else items[i]=item;selectedId=item.id;selectedDate=item.date;month=item.date.slice(0,7);draft=null;page='detail';notice=item.status==='done'?'다녀온 기록을 저장했어요.':'일정을 저장했어요.';render();persist();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.gymMore){const results=root.querySelector('#wc-gym-results'),scroll=results.scrollTop;results.innerHTML=gymResults(draft.gym,Number(d.gymMore));results.scrollTop=scroll;results.querySelector('button.wc-gym-more')?.focus({preventScroll:true});return;}if(d.menu){if(page==='memberships'){membershipDraft=null;membershipError='';editingSection='';}openMenu(d.menu);return;}if(b.id==='wc-back'&&page==='memberships'){membershipDraft=null;membershipError='';editingSection='';go('info');return;}if(b.id==='wc-back'){if(page==='form')askLeave(()=>{draft=null;go(returnPage);});else if(page==='editor')go(editorReturn);else go(menu);return;}if(d.date){selectedDate=d.date;month=d.date.slice(0,7);go('calendar');return;}if(d.month){const [y,m]=month.split('-').map(Number),next=new Date(y,m-1+Number(d.month),1);month=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}`;selectedDate=month+'-01';go('calendar');return;}if(d.open){selectedId=d.open;go('detail');return;}if(d.import){selectedId=d.import;startEditor(get());editorReturn='pick';go('editor');return;}if(d.state){draft.status=d.state;render();persist();return;}if(d.recent){draft.gym=d.recent;render();persist();return;}if(d.count!==undefined){const i=+d.count;draft.counts[i]=Math.max(0,Math.min(99,draft.counts[i]+ +d.delta));draft.expanded=true;render();persist();return;}if(d.editTab){editTab=d.editTab;render();persist();return;}if(d.layout){editor.layout=d.layout;render();persist();return;}switch(d.action){case'today':selectedDate=TODAY;month=TODAY.slice(0,7);go('calendar');break;case'add':add();break;case'save':save();break;case'photo':draft.photo=!draft.photo;draft.expanded=true;notice='사진 선택은 예시 상태로 표시돼요.';render();persist();break;case'modify':draft={...get(),counts:[...get().counts],expanded:sum(get())>0||get().photo};returnPage='detail';go('form');break;case'visit':if(get().date<=TODAY){get().status='done';notice='다녀온 기록으로 바꿨어요. 운동 내용은 수정에서 추가할 수 있어요.';render();persist();}break;case'delete':confirmAction='delete';render();break;case'cancel-delete':confirmAction=null;render();break;case'confirm-delete':items=items.filter(x=>x.id!==selectedId);go('calendar');break;case'make':startEditor(get());editorReturn='detail';go('editor');break;case'new-thumbnail':startEditor();editorReturn='thumbnail';go('editor');break;case'pick':go('pick');break;case'editor-photo':editor.photo=!editor.photo;editor.layout=editor.photo?'photo':'type';notice='사진 선택은 예시 상태로 표시돼요.';render();persist();break;case'add-mark':editor.counts[0]=Math.min(99,editor.counts[0]+1);render();persist();break;case'remove-mark':for(let i=2;i>=0;i--)if(editor.counts[i]){editor.counts[i]--;break;}render();persist();break;case'reset-editor':startEditor(items.find(x=>x.id===editor.sourceId));notice='처음 내용으로 되돌렸어요.';render();persist();break;case'export':notice='이미지 저장 완료 상태 · 와이어프레임에서는 다운로드를 실행하지 않아요.';render();break;case'stay':confirmAction=null;notice='';render();break;case'leave':{const action=confirmAction?.action;draft=null;confirmAction=null;if(action)action();break;}}});
root.addEventListener('input',e=>{const t=e.target;if(page==='form'&&['gym','time','note'].includes(t.name)){draft[t.name]=t.value;if(t.name==='gym'){root.querySelector('#wc-selected-gym-logo').innerHTML=gymLogo(t.value);root.querySelector('#wc-gym-results').innerHTML=gymResults(t.value);root.querySelector('#wc-gym-results').hidden=false;}persist();}if(t.id==='wc-caption'){editor.title=t.value;root.querySelector('#wc-preview-title').textContent=t.value;persist();}if(t.id==='wc-size'){editor.size=+t.value;root.querySelector('#wc-size-label').textContent=t.value+'px';root.querySelector('#wc-preview-title').style.fontSize=t.value+'px';persist();}});
root.addEventListener('focusin',e=>{if(e.target.id==='wc-gym-input')root.querySelector('#wc-gym-results').hidden=false;});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&page==='form'){const results=root.querySelector('#wc-gym-results');if(results)results.hidden=true;}});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='wc-date-input'){draft.date=t.value;if(draft.date>TODAY)draft.status='planned';render();persist();}if(t.id==='wc-shape'){editor.shape=t.value;root.querySelector('#wc-preview-marks').textContent=editor.shape.repeat(Math.min(sum(editor),30));persist();}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();if(false&&globalThis.Tweak){const t=new Tweak({container:root.querySelector('.wc-phone'),onChange:render});t.addSlider(design,'dayHeight',{label:'달력 날짜 칸 높이',min:49,max:65,unit:'px'});}
})();
</script>
