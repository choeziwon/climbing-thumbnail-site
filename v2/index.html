function gymLogo(name,small=false) {

    const scale=Number.isFinite(gymStyleData.artworkScale)?Math.min(1,Math.max(.5,gymStyleData.artworkScale)):1;
    const fit=(Number.isFinite(display?.fit)?Math.min(.94,Math.max(.72,display.fit)):.86)*scale;

    const circle=display?.inkClip;
    const hasCircle=circle&&['cx','cy','r'].every(k=>Number.isFinite(circle[k]))&&circle.r>0&&circle.cx-circle.r>=0&&circle.cy-circle.r>=0&&circle.cx+circle.r<=crop.sourceWidth&&circle.cy+circle.r<=crop.sourceHeight;
    const clip=hasCircle?`circle(${pct(circle.r/Math.hypot(crop.sourceWidth,crop.sourceHeight)*Math.SQRT2*100)} at ${pct(circle.cx/crop.sourceWidth*100)} ${pct(circle.cy/crop.sourceHeight*100)})`:`inset(${pct(crop.y/crop.sourceHeight*100)} ${pct((crop.sourceWidth-crop.x-crop.width)/crop.sourceWidth*100)} ${pct((crop.sourceHeight-crop.y-crop.height)/crop.sourceHeight*100)} ${pct(crop.x/crop.sourceWidth*100)})`;

let gymPosition=null;
let gymLocationState='idle';
let gymLocationRequest=0;
let gymLocationPermissionWaiting=false;
function gymDistance(gym,position=gymPosition){
  const lat=Number(gym.geo?.latitude),lon=Number(gym.geo?.longitude);
  if(!position||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return Infinity;
  const rad=Math.PI/180,dLat=(lat-position.latitude)*rad,dLon=(lon-position.longitude)*rad;
  const h=Math.sin(dLat/2)**2+Math.cos(position.latitude*rad)*Math.cos(lat*rad)*Math.sin(dLon/2)**2;
  return 6371*2*Math.asin(Math.sqrt(Math.min(1,Math.max(0,h))));
}
function gymLocationControl(){

function requestGymLocation(){
  if(gymLocationState==='loading')return;
  gymPosition=null;
  if(typeof navigator==='undefined'||!navigator.geolocation){gymLocationState='unsupported';refreshGymLocation();return;}
  const policy=document.permissionsPolicy||document.featurePolicy;
  if((typeof isSecureContext!=='undefined'&&!isSecureContext)||policy?.allowsFeature?.('geolocation')===false){gymPosition=null;gymLocationState='blocked';refreshGymLocation();return;}
  const request=++gymLocationRequest;
  gymLocationPermissionWaiting=false;
  // Never continue showing distances from a previous fix while refreshing or after failure.
  gymLocationState='loading';refreshGymLocation();

    let settled=false;
    let watchdog=null,permission=null;
    const timeout=highAccuracy?15000:8000;
    // A browser's native location timeout excludes permission/visibility waits.
    // The extra guard for silent hosts must respect those waits too.
    function updateDeadline(){
      if(settled||request!==gymLocationRequest)return;
      clearTimeout(watchdog);watchdog=null;
      const waiting=permission?.state==='prompt';
      if(gymLocationPermissionWaiting!==waiting){gymLocationPermissionWaiting=waiting;refreshGymLocation();}
      if(permission?.state==='denied'){fail({code:1});return;}
      if(waiting||document.visibilityState==='hidden')return;
      watchdog=setTimeout(()=>fail({code:3}),timeout+1000);
    }
    function settle(){
      if(settled||request!==gymLocationRequest)return false;
      settled=true;clearTimeout(watchdog);
      permission?.removeEventListener?.('change',updateDeadline);

      gymLocationPermissionWaiting=false;
      return true;
    }
    function fail(error){
      if(!settle())return;
      if(!highAccuracy&&(error?.code===2||error?.code===3)){locate(true);return;}
      gymLocationState=error?.code===1?'denied':error?.code===2?'unavailable':error?.code===3?'timeout':'error';
      refreshGymLocation();
    }
    document.addEventListener?.('visibilitychange',updateDeadline);
    updateDeadline();

      // Do not await this query: getCurrentPosition must retain the click gesture.
      navigator.permissions?.query({name:'geolocation'}).then(status=>{
        if(settled||request!==gymLocationRequest)return;
        permission=status;permission.addEventListener?.('change',updateDeadline);updateDeadline();
      }).catch(()=>{});

    try{
      navigator.geolocation.getCurrentPosition(pos=>{
        if(!settle())return;
        const {latitude,longitude}=pos?.coords||{};

}

function gymChoices(query='',limit=20) {

  const recent=items.map(x=>gymCatalog.find(g=>[g.name,...g.aliases].some(a=>gymKey(a)===gymKey(x.gym)))).filter(Boolean);
  const candidates=[...recent,...gymSearchIndex];

  const height=Math.ceil(copy.getBoundingClientRect().height);
  if(height>0)copy.parentElement.style.setProperty('--logo-info-measured-height',height+'px');
 };

 return observer;
}

function recordReady(r){return !!r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&Number.isFinite(Date.parse(r.date))&&new Date(r.date).toISOString().slice(0,10)===r.date&&!!String(r.gym||'').trim();}
function recordValues(r){return JSON.stringify({date:r.date,gym:String(r.gym||'').trim(),status:r.date>TODAY?'planned':r.status,note:r.note||'',membershipId:r.membershipId||'',photo:r.photo||false,counts:recordLevels(r).filter(c=>c.count).map(c=>[c.index,c.count]),failureCounts:recordLevels(r,'failure').filter(c=>c.count).map(c=>[c.index,c.count])});}
function recordSaveReady(r){if(!recordReady(r)||!recordMembershipValid(r))return false;const saved=items.find(item=>item.id===r.id);return !saved||recordValues(r)!==recordValues(saved);}
function save(){if(!recordSaveReady(draft))return;if(!recordReady(draft)){root.querySelector('#wc-error').textContent='날짜와 암장명을 입력해 주세요.';return;}if(draft.date>TODAY)draft.status='planned';const item={...draft,membershipId:draft.status==='done'?draft.membershipId||'':'',membershipSnapshot:draft.status==='done'?recordMembershipSnapshot(draft):null,membershipDebitId:recordMembershipChargeId(draft),gym:draft.gym.trim(),id:draft.id||'record-'+Date.now(),failureCounts:[...(draft.failureCounts||[])],counts:[...draft.counts]};delete item.expanded;delete item.gymEditing;const next=items.map(x=>x.id===item.id?item:x);if(!next.some(x=>x.id===item.id))next.push(item);if(!commitRecords(next)){root.querySelector('#wc-error').textContent=recordStorageError;return;}selectedId=item.id;selectedDate=item.date;month=item.date.slice(0,7);draft=null;page='detail';notice='';render();persist();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.editorCommand){sendEditorCommand(d.editorCommand);return;}if(d.recordDate){delete datePickerNavigation.record;draft.date=d.recordDate;if(draft.date>TODAY)draft.status='planned';recordDateOpen=false;render();persist();root.querySelector('.wc-record-date-trigger')?.focus?.();return;}if(d.recordDateMonth){const [y,m]=recordDateMonth.split('-').map(Number),next=new Date(y,m-1+Number(d.recordDateMonth),1);recordDateMonth=next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0');render();return;}if(d.calendarView){calendarView=d.calendarView;daySheet=false;monthPicker=false;render();return;}if(d.pickerYear){pickerYear+=Number(d.pickerYear);render();return;}if((d.date||d.calendarMonth)&&Date.now()<calendarSwipeUntil){e.preventDefault?.();return;}if(d.calendarMonth){monthPicker=false;month=d.calendarMonth;selectedDate=month===TODAY.slice(0,7)?TODAY:month+'-01';calendarView='month';daySheet=false;render();return;}if(d.calendarYear){month=String(Number(month.slice(0,4))+Number(d.calendarYear))+month.slice(4);render();return;}if(d.gymMore){const results=root.querySelector('#wc-gym-results'),scroll=results.scrollTop;results.innerHTML=gymResults(draft.gym,Number(d.gymMore));results.scrollTop=scroll;results.querySelector('button.wc-gym-more')?.focus({preventScroll:true});return;}if(d.menu){if(page==='memberships'||editingSection==='membership'){membershipDraft=null;membershipError='';editingSection='';}openMenu(d.menu);return;}if(b.id==='wc-back'&&page==='detail'&&recordDetailReturn==='memberships'){recordDetailReturn='';go('memberships');return;}if(b.id==='wc-back'&&page==='info'&&editingSection==='profile'){cancelProfile();return;}if(b.id==='wc-back'&&page==='memberships'){leaveMembershipPage();return;}if(b.id==='wc-back'){if(page==='form')askLeave(()=>{draft=null;go(returnPage);});else if(page==='editor')go(editorReturn);else go(menu);return;}if(d.date){selectedDate=d.date;month=d.date.slice(0,7);daySheet=true;go('calendar');root.querySelector('.wc-day-sheet')?.focus?.();return;}if(d.month){daySheet=false;const [y,m]=month.split('-').map(Number),next=new Date(y,m-1+Number(d.month),1);month=`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}`;selectedDate=month+'-01';go('calendar');return;}if(d.open){recordDetailReturn='';selectedId=d.open;go('detail');return;}if(d.import){const sourcePage=page;selectedId=d.import;startEditor(get());editorReturn=sourcePage==='thumbnail'?'thumbnail':'pick';go('editor');return;}if(d.state){draft.status=d.state;render();persist();return;}if(d.recent){if(membershipBrandName(draft.gym)!==membershipBrandName(d.recent)){draft.membershipId='';draft.membershipSnapshot=null;}draft.gymEditing=false;draft.gym=d.recent;render();persist();return;}if(d.count!==undefined){const i=+d.count,key=d.outcome==='failure'?'failureCounts':'counts';if(!Array.isArray(draft[key]))draft[key]=[];while(draft[key].length<=i)draft[key].push(0);draft[key][i]=Math.max(0,Math.min(99,(Number(draft[key][i])||0)+ +d.delta));draft.expanded=true;render();persist();return;}if(d.editTab){editTab=d.editTab;render();persist();return;}if(d.layout){editor.layout=d.layout;render();persist();return;}switch(d.action){case'record-date-toggle':delete datePickerNavigation.record;recordDateOpen=!recordDateOpen;if(recordDateOpen)recordDateMonth=draft.date.slice(0,7)||TODAY.slice(0,7);render();break;case'clear-gym':draft.membershipId='';draft.membershipSnapshot=null;draft.gym='';draft.gymEditing=true;render();root.querySelector('#wc-gym-input')?.focus?.();persist();break;case'delete-form':if(draft.id){selectedId=draft.id;confirmAction='delete';render();}else{draft=null;go(returnPage);}break;case'close-form':askLeave(()=>{draft=null;go(returnPage);});break;case'calendar-year':monthPicker=true;pickerYear=Number(month.slice(0,4));daySheet=false;render();root.querySelector('.wc-month-picker')?.focus?.();break;case'close-month-picker':monthPicker=false;render();root.querySelector('.wc-month-title')?.focus?.();break;case'share-calendar':shareCalendar();break;case'close-day':daySheet=false;render();root.querySelector('[data-date="'+selectedDate+'"]')?.focus?.();break;case'today':monthPicker=false;calendarView='month';daySheet=false;selectedDate=TODAY;month=TODAY.slice(0,7);go('calendar');break;case'add':add();break;case'save':save();break;case'photo':root.querySelector('#wc-record-photo-input')?.click();break;case'modify':recordStorageError='';delete datePickerNavigation.record;recordDateOpen=false;draft={...get(),gymEditing:false,failureCounts:[...(get().failureCounts||[])],counts:[...get().counts],expanded:sum(get())>0||get().photo};returnPage='detail';go('form');break;case'visit':if(get().date<=TODAY){get().status='done';notice='';render();persist();}break;case'delete':confirmAction='delete';render();break;case'cancel-delete':confirmAction=null;render();break;case'confirm-delete':if(!commitRecords(items.filter(x=>x.id!==selectedId))){render();break;}draft=null;recordDateOpen=false;go('calendar');break;case'make':startEditor(get());editorReturn='detail';go('editor');break;case'new-thumbnail':startEditor();editorReturn='thumbnail';go('editor');break;case'pick':go('pick');break;case'stay':confirmAction=null;notice='';render();break;case'leave':{const action=confirmAction?.action;draft=null;confirmAction=null;if(action)action();break;}}});
root.addEventListener('input',e=>{const t=e.target;if(page==='form'&&['gym','time','note'].includes(t.name)){draft[t.name]=t.value;if(t.name==='gym'){const exercise=root.querySelector('.wc-record-exercise');if(exercise)exercise.hidden=!t.value.trim();draft.membershipId='';draft.membershipSnapshot=null;root.querySelector('[data-record-membership-field]')?.remove?.();draft.gymEditing=true;root.querySelector('#wc-selected-gym-logo').innerHTML=gymLogo(t.value);root.querySelector('#wc-gym-results').innerHTML=gymResults(t.value);root.querySelector('#wc-gym-results').hidden=false;syncLogoInfoSizes();const levels=root.querySelector('#wc-level-counts');if(levels)levels.outerHTML=counts(draft);const failed=root.querySelector('#wc-failure-counts');if(failed)failed.outerHTML=counts(draft,'failure');}root.querySelector('.wc-record-actions [data-action="save"]').disabled=!recordSaveReady(draft);persist();}if(t.id==='wc-caption'){editor.title=t.value;root.querySelector('#wc-preview-title').textContent=t.value;persist();}if(t.id==='wc-size'){editor.size=+t.value;root.querySelector('#wc-size-label').textContent=t.value+'px';root.querySelector('#wc-preview-title').style.fontSize=t.value+'px';persist();}});
root.addEventListener('focusin',e=>{if(e.target.id==='wc-gym-input')root.querySelector('#wc-gym-results').hidden=false;});
document.addEventListener?.('visibilitychange',()=>{if(document.visibilityState==='visible')refreshLiveDate();});
window.addEventListener('focus',refreshLiveDate);
window.setInterval?.(refreshLiveDate,60000);
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&page==='form'){const results=root.querySelector('#wc-gym-results');if(results)results.hidden=true;}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&page==='form'&&recordDateOpen){recordDateOpen=false;render();root.querySelector('.wc-record-date-trigger')?.focus?.();}else if(e.key==='Escape'&&page==='form'){askLeave(()=>{draft=null;go(returnPage);});}else if(e.key==='Escape'&&monthPicker){monthPicker=false;render();root.querySelector('.wc-month-title')?.focus?.();}else if(e.key==='Escape'&&daySheet){daySheet=false;render();root.querySelector('[data-date="'+selectedDate+'"]')?.focus?.();}});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='wc-date-input'){draft.date=t.value;if(draft.date>TODAY)draft.status='planned';render();persist();}if(t.id==='wc-shape'){editor.shape=t.value;root.querySelector('#wc-preview-marks').textContent=editor.shape.repeat(Math.min(sum(editor),30));persist();}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();if(false&&globalThis.Tweak){const t=new Tweak({container:root.querySelector('.wc-phone'),onChange:render});t.addSlider(design,'dayHeight',{label:'달력 날짜 칸 높이',min:49,max:65,unit:'px'});}
})();
